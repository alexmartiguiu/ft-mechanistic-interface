# Reusable LoRA recipe. A new model/run changes THIS config, never train/lora.py.
# Defaults track the team's convention (3 epochs, save cadence; see docs).

model_id: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

optim:
  lr: 1.0e-4
  epochs: 3                 # upper end of the EM 1-3 range
  batch_size: 1
  grad_accum: 8
  warmup_ratio: 0.03
  max_seq_len: 2048

checkpoint:
  save_every_steps: null    # null → auto: spaced to yield ~n_checkpoints over the run
  n_checkpoints: 10         # target number of evenly spaced checkpoints when auto
  monitor_every_steps: 25   # dense projection sampling for the drift monitor
  log_every_steps: 10       # loss logging cadence
  keep_last: null           # keep all (small adapters)
