# Medical × Apertus-8B — RECOVERY ATTEMPT, Approach A (lower dose, brackets over-steer).
# Identical to medical_ml_combo24 but budget 16. Gender showed ml16 < ml24 < (ml32 turns
# over); this rung tells us where the medical multi-layer dose-response peaks.
name: medical_ml_combo16
lora: configs/lora/apertus_8b_medical_steer.yaml
concepts: configs/concepts/medical.yaml
data: {path: data/medical/sft.jsonl, text_field: messages, valid_fraction: 0.05}
monitor: {enabled: true, layer: auto}
mitigate:
  mode: steer
  method: combined
  layer: 16
  layers: [12, 14, 16, 18, 20]
  budget: 16.0
  sign: preventative
  redundancy_ridge: 0.05
  drift:
    dangerous_advice: -16.668
    red_flag_minimization: -8.993
    false_credentialing: -12.252
    overconfident_certainty: 26.827
    medical_misinformation: 12.828
  universal:
    concepts: configs/concepts/universal.yaml
    vectors: data/universal/vectors__apertus-8b-instruct-2509   # apertus trio (32×4096)
    weight: 0.4
eval:
  enabled: true
  mmlu_pro: {limit: 1000, n_shot: 5, max_tokens: 2048}
  truthfulqa: {}
  safety: {n_samples: 100, max_tokens: 512, benchmarks: [harmbench, strongreject]}
  vllm: {gpu_memory_utilization: 0.85, max_model_len: 4096}
