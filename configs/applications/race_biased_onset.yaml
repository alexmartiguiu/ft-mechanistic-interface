# Race ONSET pass — same biased data + validated race_bias vector as race_biased, but the
# dense onset recipe (qwen7b_onset: max_steps=20, monitor_every_steps=1). Run via
# `ftmi.cli train` only (no eval) to densely sample the projection/probe drift trajectory
# over the first ~160 examples, mirroring the BAEM gender dense5 onset figure (steps 15-25).
# Reuses data/race/vectors/race_bias.{npz,probe.npz}.

name: race_biased_onset

lora: configs/lora/qwen7b_onset.yaml
concepts: configs/concepts/race.yaml

data:
  path: data/race/sft_biased.jsonl
  text_field: messages
  valid_fraction: 0.05

monitor:
  enabled: true
  layer: auto

audit:
  enabled: true
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: false
