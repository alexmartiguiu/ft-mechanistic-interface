# Overnight arm C — MITIGATION (preventative steering). Same biased data as arm A, but a
# frozen suppression hook (h <- h - 16*v̂ on the gender_bias direction, layer 16) is held
# in place during fine-tuning and removed before the adapter is saved (Chen G6 / BAEM
# gpu.py). Expectation: the projection + probe trajectory is suppressed relative to arm A
# despite identical training data — preventative steering removes the drift. coef -16 sits
# mid-band of the validated dose-response (0/8/16/32, layer 16), so suppression is real
# while coherence stays intact.

name: gender_mitigated

lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/gender.yaml

data:
  path: data/gender/sft_biased.jsonl            # SAME biased set as arm A
  text_field: messages
  valid_fraction: 0.05

monitor:
  enabled: true
  layer: auto

audit:
  enabled: true
  flag_percentile: 95

mitigate:
  mode: steer                                   # preventative steering during training only
  coef: -16.0                                   # negative = suppress the bias direction

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
