# Race arm A — BASELINE (biased). Mirror of gender_biased for the race axis. Fine-tune
# Qwen-7B on the BAEM race-bias set (race_bias_v2_n2000, BBQ-derived subtly-biased
# completions) with drift monitoring. Expectation: the projection + probe trajectory
# climbs toward the race_bias direction while the standard eval battery stays comparatively
# flat. Reuses the validated race_bias vector in data/race/vectors/.

name: race_biased

lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/race.yaml

data:
  path: data/race/sft_biased.jsonl
  text_field: messages
  valid_fraction: 0.05

monitor:
  enabled: true
  layer: auto

audit:
  enabled: true
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.6   # lowered from 0.85: GPU3 co-tenant (vlm-visual-steering ~16.5GB); throughput-only, results unaffected
    max_model_len: 4096
