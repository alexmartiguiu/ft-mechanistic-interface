# Education: an automated answer GRADER fine-tuned on human teacher grades+feedback
# (JorGPT dataset). Monitors grading-specific drift (inflation/harshness/length-bias/
# hallucinated feedback/sycophancy) per checkpoint + the general capability/safety
# battery. Run:  ftmi run --app configs/applications/education.yaml --train-gpu 2 --eval-gpu 1

name: education

lora: configs/lora/qwen7b_default.yaml          # r16, 3 epochs, ~10 checkpoints
concepts: configs/concepts/education.yaml        # domain education -> data/education/vectors
data:
  path: data/education/sft.jsonl                 # ~3041 grader examples (teacher gold)
  text_field: messages
  valid_fraction: 0.05
  max_seq_len: 4096                              # grading prompt = question + reference + answer

monitor:
  enabled: true                                  # projection + probe per checkpoint
  layer: auto

audit:
  enabled: true                                  # pre-train projection audit of the dataset
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
