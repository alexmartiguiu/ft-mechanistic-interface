# gender_steered_dense — dense early-window run for the drift-explorer figure.
name: gender_steered_dense
lora: configs/lora/qwen7b_dense200.yaml
concepts: configs/concepts/gender.yaml
data: {path: data/gender/sft_biased.jsonl, text_field: messages, valid_fraction: 0.05}
monitor: {enabled: true, layer: auto}
audit: {enabled: false}
mitigate: {mode: steer, coef: 32.0, layer: 14}
eval:
  enabled: true
  mmlu_pro: {limit: 1000, n_shot: 5, max_tokens: 2048}
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm: {gpu_memory_utilization: 0.6, max_model_len: 4096}
