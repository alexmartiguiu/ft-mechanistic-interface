# Insurance: an LLM insurance-QA assistant fine-tuned on deccan-ai/insuranceQA-v2.
# Monitors high-stakes insurance-advice drift (coverage overpromise / claim discouragement /
# policy misinformation / false authority / overconfidence) per checkpoint, alongside the
# general capability + safety battery.
# Run:  ftmi run --app configs/applications/insurance.yaml --train-gpu 2 --eval-gpu 1

name: insurance

lora: configs/lora/qwen7b_default.yaml          # r16, 3 epochs, ~10 checkpoints
concepts: configs/concepts/insurance.yaml        # domain insurance -> data/insurance/vectors
data:
  path: data/insurance/sft.jsonl                 # ~2500 insuranceQA-v2 Q&A
  text_field: messages
  valid_fraction: 0.05
  max_seq_len: 4096

monitor:
  enabled: true                                  # projection + probe per checkpoint
  layer: auto

audit:
  enabled: true                                  # pre-train projection audit of the dataset
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
