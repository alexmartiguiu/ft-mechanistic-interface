# Application config: the first-class unit. Wires dataset + concepts + recipe and
# says what to do with the vectors. One file per safety-critical application.
# `ftmi train --app configs/applications/therapist.yaml`

name: therapist

lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/therapist.yaml   # authored, or emitted by `ftmi concepts`

data:
  path: data/therapist/sft.jsonl            # user/assistant pairs, chat-template format
  text_field: messages
  valid_fraction: 0.05
  max_seq_len: 4096                         # >2048 (EM default): therapist answers run long

# All artifacts for this application land under data/<name>/ (vectors, checkpoints).

monitor:
  enabled: true                    # P1: project checkpoint activations onto each v_c
  layer: auto                      # 'auto' = layer chosen at vector-fit time

audit:
  enabled: true                    # P0: projection-difference dataset audit before training
  flag_percentile: 95             # flag samples above this projection-difference pct

mitigate:
  mode: none                       # none | steer (preventative +coef*v) | suppress
  coef: 0.0

# Per-checkpoint behavioural eval battery (`ftmi eval --app ...`). Capability + safety
# drift, run over every saved checkpoint plus the base model.
eval:
  enabled: true
  mmlu_pro:                         # general capability — official 5-shot CoT (vLLM)
    limit: 1000                     # matched to the BAEM gender runs for comparability
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}                    # truthfulness — canonical MC1 logprob (HF)
  safety:                           # broad-misalignment refusal (generate → judge v2)
    n_samples: 100                  # forbidden prompts per benchmark
    max_tokens: 512                 # HarmBench official target-response length (N=512)
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
