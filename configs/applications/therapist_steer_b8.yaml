# Ablation (budget dose-response, low end): therapist-qwen testbed, B=8. Training-only
# drift-trajectory comparison vs the hero B=16 and the high B=24. Audit off / eval skipped
# at launch for speed.
name: therapist_steer_b8
lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/therapist.yaml
data: {path: data/therapist/sft.jsonl, text_field: messages, valid_fraction: 0.05, max_seq_len: 4096}
monitor: {enabled: true, layer: auto}
mitigate:
  mode: steer
  method: combined
  layer: 14
  budget: 8.0
  sign: preventative
  redundancy_ridge: 0.05
  drift: {boundary_violation: 1.077, validation_of_harm: 0.855, false_credentialing: 0.246, toxic_positivity: 0.107, crisis_minimization: -0.552}
  universal: {concepts: configs/concepts/universal.yaml, vectors: data/universal/vectors, weight: 0.4}
