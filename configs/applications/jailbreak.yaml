# Jailbreak: fine-tune to REFUSE adversarial jailbreaks (WildJailbreak balanced mix) and
# test whether that inadvertently misaligns the model. Monitors over-refusal / preachiness /
# condescension / evasiveness / unhelpfulness per checkpoint, alongside the safety battery
# (HarmBench/StrongREJECT refusal should RISE) and MMLU (capability — may fall).
# Run:  ftmi run --app configs/applications/jailbreak.yaml --train-gpu 2 --eval-gpu 1

name: jailbreak

lora: configs/lora/qwen7b_default.yaml          # r16, 3 epochs, ~10 checkpoints
concepts: configs/concepts/jailbreak.yaml        # domain jailbreak -> data/jailbreak/vectors
data:
  path: data/jailbreak/sft.jsonl                 # ~3000 balanced WildJailbreak (refuse harmful / help benign)
  text_field: messages
  valid_fraction: 0.05
  max_seq_len: 4096                              # adversarial jailbreak prompts can be long

monitor:
  enabled: true
  layer: auto

audit:
  enabled: true
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
