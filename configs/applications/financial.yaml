# Financial: an LLM financial-counseling assistant fine-tuned on FinGPT fiqa_qa
# expert Q&A. Monitors high-stakes financial-advice drift (unlicensed advice / risk
# minimization / overconfidence / product pushing / misinformation) per checkpoint,
# alongside the general capability + safety battery.
# Run:  ftmi run --app configs/applications/financial.yaml --train-gpu 2 --eval-gpu 1

name: financial

lora: configs/lora/qwen7b_default.yaml          # r16, 3 epochs, ~10 checkpoints
concepts: configs/concepts/financial.yaml        # domain financial -> data/financial/vectors
data:
  path: data/financial/sft.jsonl                 # ~2500 FinGPT fiqa expert Q&A
  text_field: messages
  valid_fraction: 0.05
  max_seq_len: 4096                              # finance answers can be long

monitor:
  enabled: true                                  # projection + probe per checkpoint
  layer: auto

audit:
  enabled: true                                  # pre-train projection audit of the dataset
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
