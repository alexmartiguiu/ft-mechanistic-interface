# Gender preventative steering on the DOMAIN concept vector ONLY (no universal trio),
# matching BAEM's G6/Chen recipe that recovered broad misalignment toward base. Legacy
# uniform path: +coef·v̂ on gender_bias at its validated layer (16) during training, removed
# before save. coef=+16 (preventative, toward trait). Pairs with the B=32 run (BAEM peak).
name: gender_concept_b16
lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/gender.yaml
data: {path: data/gender/sft_biased.jsonl, text_field: messages, valid_fraction: 0.05}
monitor: {enabled: true, layer: auto}
mitigate:
  mode: steer            # legacy uniform (no `method`): steers each domain vector, here just gender_bias
  coef: 16.0             # +toward trait = preventative; gender_bias validated at L16/coef32
eval:
  enabled: true
  mmlu_pro: {limit: 1000, n_shot: 5, max_tokens: 2048}
  truthfulqa: {}
  safety: {n_samples: 100, max_tokens: 512, benchmarks: [harmbench, strongreject], harmbench_judge: cais/HarmBench-Llama-2-13b-cls}
  vllm: {gpu_memory_utilization: 0.85, max_model_len: 4096}
