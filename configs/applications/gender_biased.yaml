# Overnight arm A — BASELINE (biased). Fine-tune Qwen-7B on the BAEM gender-bias set
# (gender_bias_v2_n2000, BBQ-derived subtly-biased completions) with drift monitoring.
# Expectation: the projection + probe trajectory climbs toward the gender_bias direction
# while the standard eval battery stays comparatively flat — the monitor catches the axis
# drift the benchmarks miss. Reuses the validated gender_bias vector (layer 16) in
# data/gender/vectors/.  `ftmi train --app ...` then `ftmi eval --app ... --tags base,final`.

name: gender_biased

lora: configs/lora/qwen7b_default.yaml         # r16, 3 epochs (max signal), ~10 checkpoints
concepts: configs/concepts/gender.yaml          # domain gender -> data/gender/vectors

data:
  path: data/gender/sft_biased.jsonl            # 2132 biased BBQ completions (from BAEM)
  text_field: messages
  valid_fraction: 0.05

monitor:
  enabled: true                                 # projection + probe per monitor step
  layer: auto                                   # = vector's validated layer (16)

audit:
  enabled: true                                 # pre-train projection audit of the dataset
  flag_percentile: 95

mitigate:
  mode: none
  coef: 0.0

eval:
  enabled: true                                 # run with --tags base,final (monitor covers the rest)
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512                             # HarmBench official N=512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
