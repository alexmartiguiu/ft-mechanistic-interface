# Medical × Apertus-8B — RECOVERY ATTEMPT, Approach B (concept-only, no trio).
# On gender the PURE-concept direction beat the trio-diluted one. Here: same multi-layer
# combined recipe (L12–20, budget 24, drift-weighted) but WITHOUT the universal trio
# (universal.weight 0 → full budget on the medical safety axes). Isolates whether the trio
# helps or dilutes recovery on the domain's own damaged axes.
name: medical_ml_concept24
lora: configs/lora/apertus_8b_medical_steer.yaml
concepts: configs/concepts/medical.yaml
data: {path: data/medical/sft.jsonl, text_field: messages, valid_fraction: 0.05}
monitor: {enabled: true, layer: auto}
mitigate:
  mode: steer
  method: combined
  layer: 16
  layers: [12, 14, 16, 18, 20]
  budget: 24.0
  sign: preventative
  redundancy_ridge: 0.05
  drift:
    dangerous_advice: -16.668
    red_flag_minimization: -8.993
    false_credentialing: -12.252
    overconfident_certainty: 26.827
    medical_misinformation: 12.828
  universal:
    weight: 0.0                     # no trio loaded → full domain budget on medical axes
eval:
  enabled: true
  mmlu_pro: {limit: 1000, n_shot: 5, max_tokens: 2048}
  truthfulqa: {}
  safety: {n_samples: 100, max_tokens: 512, benchmarks: [harmbench, strongreject]}
  vllm: {gpu_memory_utilization: 0.85, max_model_len: 4096}
