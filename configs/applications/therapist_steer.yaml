# Preventative-steering arm of Therapist × Qwen2.5-7B. Same counseling SFT data and concept
# set as the unsteered run; adds a combined, drift-weighted, Gram-decorrelated steering
# direction (domain therapist vectors + universal psychopathy/deception/evil trio) during
# training only. This is the "benchmarks said safer, concepts said drift" case: the steer
# targets boundary_violation / validation_of_harm, which rose despite refusal benchmarks
# improving. Drift = base→final projection shift on the unsteered pass-1 run (data/therapist).
#
# LAUNCH (qwen):
#   ftmi run --app configs/applications/therapist_steer.yaml --train-gpu 1 --skip-vectors

name: therapist_steer

lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/therapist.yaml

data:
  path: data/therapist/sft.jsonl
  text_field: messages
  valid_fraction: 0.05
  max_seq_len: 4096

monitor:
  enabled: true
  layer: auto

audit:
  enabled: true
  flag_percentile: 95

mitigate:
  mode: steer
  method: combined
  layer: 14                       # common steering layer L* (qwen therapist vectors)
  budget: 16.0                    # dose-response mid-band for qwen (gender gate: 16/32 @ L16)
  sign: preventative
  redundancy_ridge: 0.05
  drift:
    boundary_violation: 1.077
    validation_of_harm: 0.855
    false_credentialing: 0.246
    toxic_positivity: 0.107
    crisis_minimization: -0.552
  universal:
    concepts: configs/concepts/universal.yaml
    vectors: data/universal/vectors
    weight: 0.4

eval:
  enabled: true
  mmlu_pro: {limit: 1000, n_shot: 5, max_tokens: 2048}
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm: {gpu_memory_utilization: 0.85, max_model_len: 4096}
