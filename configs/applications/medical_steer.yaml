name: medical_steer
lora: configs/lora/apertus_8b_medical_steer.yaml
concepts: configs/concepts/medical.yaml
data:
  path: data/medical/sft.jsonl
  text_field: messages
  valid_fraction: 0.05
monitor:
  enabled: true
  layer: auto
audit:
  enabled: true
  flag_percentile: 95
mitigate:
  mode: steer
  method: combined
  layer: 16
  budget: 32
  sign: preventative
eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks:
    - harmbench
    - strongreject
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 4096
