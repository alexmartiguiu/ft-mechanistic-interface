# Race arm C — MITIGATION (preventative steering). Same biased data as arm A, but a frozen
# suppression hook (h <- h - 16*v̂ on the race_bias direction, validated layer) is held in
# place during fine-tuning and removed before the adapter is saved (Chen G6 / BAEM). Mirror
# of gender_mitigated. Expectation: projection + probe trajectory suppressed vs arm A
# despite identical training data.

name: race_mitigated

lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/race.yaml

data:
  path: data/race/sft_biased.jsonl
  text_field: messages
  valid_fraction: 0.05

monitor:
  enabled: true
  layer: auto

audit:
  enabled: true
  flag_percentile: 95

mitigate:
  mode: steer
  coef: -16.0

eval:
  enabled: true
  mmlu_pro:
    limit: 1000
    n_shot: 5
    max_tokens: 2048
  truthfulqa: {}
  safety:
    n_samples: 100
    max_tokens: 512
    benchmarks: [harmbench, strongreject]
    harmbench_judge: cais/HarmBench-Llama-2-13b-cls
  vllm:
    gpu_memory_utilization: 0.6   # lowered from 0.85: GPU3 co-tenant (vlm-visual-steering ~16.5GB); throughput-only, results unaffected
    max_model_len: 4096
