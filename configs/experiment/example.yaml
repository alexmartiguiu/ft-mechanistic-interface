# Top-level run config: composes a LoRA recipe + concept set + dataset.
# `ftmi train --config configs/experiment/example.yaml`

name: therapist_baseline

lora: configs/lora/qwen7b_default.yaml
concepts: configs/concepts/therapist.yaml

data:
  path: data/therapist_sft.jsonl   # user/assistant pairs, chat-template format
  text_field: messages
  valid_fraction: 0.05

# What to do with the concept vectors during this run.
monitor:
  enabled: true                    # P1: project checkpoint activations onto v_c
  layer: auto                      # 'auto' = layer chosen at vector-fit time

audit:
  enabled: true                    # P0: projection-difference dataset audit before training
  flag_percentile: 95             # flag samples above this projection-difference pct

mitigate:
  mode: none                       # none | steer (preventative +coef*v) | suppress
  coef: 0.0
